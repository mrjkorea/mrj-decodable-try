<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MRJ Decodables — Books 1–10</title>
<style>
:root{--bg:#070d18;--card:#101a2e;--text:#f4f7ff;--muted:#a9b7d6;--hl:#ffd84a;--ok:#3ecf8e}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Nunito","Avenir Next",system-ui,sans-serif;background:#070d18;color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:8px 12px 118px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:1rem;margin:0}
button{border:0;border-radius:14px;padding:11px;font-weight:800;color:#fff;background:#24324f;cursor:pointer}
button.active{background:linear-gradient(135deg,#4d7dff,#7a5cff)}
button:disabled{opacity:.38;cursor:not-allowed}
.stage{background:var(--card);border-radius:22px;overflow:hidden}
.art{position:relative;aspect-ratio:3/4;background:#050a12;max-height:78vh}
.art img,.art video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.sentence{font-size:clamp(1.7rem,6.8vw,2.6rem);font-weight:900;line-height:1.3;text-align:center;padding:12px 12px 4px;min-height:2.2em}
.sentence .w{display:inline-block;padding:.02em .08em;border-radius:.18em;cursor:pointer}
.sentence .w.on{background:#ffd84a;color:#1a1400;box-shadow:0 0 0 3px #ffe27a}
.sentence .w.done{outline:3px solid var(--ok);background:rgba(62,207,142,.18)}
.langline{text-align:center;color:#ffd84a;font-weight:800;padding:0 14px 10px;font-size:1.15rem}
.status{text-align:center;color:var(--muted);font-size:.84rem;padding:0 12px 10px}
.nav{display:flex;gap:8px;padding:0 12px 12px}
.nav button{flex:1}
.library{display:grid;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:#1b2740;border-radius:16px;padding:10px;color:#fff;text-align:left;width:100%}
.card img{width:64px;height:86px;object-fit:cover;border-radius:8px}
.card.lock{opacity:.55}
.g-lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:10px}
.g-en{font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;line-height:1.28;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);margin:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(7,13,24,.94);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bar-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px;margin:0 auto}
.bar-row button{font-size:.78rem;padding:10px 4px}
.hidden{display:none!important}
.panel{padding:14px}
.onelet{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.onelet .en{font-size:7.2rem;font-weight:900;line-height:1}
.onelet .cu{font-size:5.2rem;font-weight:900;color:#ffd84a;margin-top:8px}
.onelet .hint{color:var(--muted);margin-top:14px;font-weight:800}
.sadface{font-size:6.4rem;line-height:1;margin-top:8px}
.word-chip{display:inline-block;margin:4px 5px;padding:10px 12px;border-radius:14px;background:#1b2740;font-weight:900;font-size:1.45rem;text-align:center;min-width:2.2em}
.word-chip.good{background:#1f6b48}.word-chip.ok{background:#6b5a1f}.word-chip.needs_work,.word-chip.invalid{background:#6b1f2c}
.word-chip .wsub{display:block;font-size:.72rem;color:#ffd84a;font-weight:800}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.tile{min-width:48px;font-size:1.6rem;font-weight:900;padding:12px 14px;border-radius:14px;background:#2a3b61}
.az{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.az button{padding:10px 0;font-size:1.15rem}
.built{min-height:2.2em;font-size:1.55rem;font-weight:900;text-align:center;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.chip{background:#3a4f7a;border-radius:12px;padding:8px 12px;font-size:1.35rem}.tile.used{opacity:.28}.spacekey{grid-column:span 3}
.tpl{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:900;text-align:center;line-height:1.7;padding:8px}
.tpl .given{color:#ffd84a}
.tpl .blank{display:inline-block;min-width:.72em;border-bottom:3px solid #fff;margin:0 1px;text-align:center}
.tpl .blank.on{border-bottom-color:#3ecf8e}
.tpl .gap{display:inline-block;width:.42em}
.wscore{display:inline-block;margin:4px;padding:6px 10px;border-radius:12px;font-weight:900}
.wscore.good{background:#1f6b48}.wscore.ok{background:#6b5a1f}.wscore.needs_work,.wscore.invalid{background:#6b1f2c}
.pass{font-size:2rem;font-weight:900;text-align:center;padding:20px 8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
select{width:100%;padding:10px;border-radius:12px;border:0;background:#1b2740;color:#fff;font-weight:800}
.scene{position:relative;min-height:58vh;overflow:hidden;border-radius:18px}
.carpet{position:absolute;inset:0;background:linear-gradient(#1a1030,#3a1020);}
.carpet:before{content:"";position:absolute;left:18%;right:18%;top:0;bottom:0;background:repeating-linear-gradient(180deg,#b0122a 0 28px,#8c0e22 28px 32px);box-shadow:0 0 40px #ff4d6d}
.flash{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;opacity:0;animation:pop 1.4s infinite}
@keyframes pop{0%,70%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1.4)}100%{opacity:0}}
.starword{position:absolute;left:50%;top:110%;transform:translateX(-50%);font-size:4.4rem;font-weight:900;color:#ffe27a;text-shadow:0 0 18px #ffd84a;animation:walk 2.6s ease forwards}
@keyframes walk{to{top:38%}}
.ropes{position:absolute;left:10%;right:10%;top:22%;height:8px;background:#d4af37}
.cops{min-height:58vh;background:radial-gradient(circle at 50% 20%,#2a406e,#101a2e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.faces{font-size:4.2rem}
.zero{font-size:6rem;font-weight:900;color:#ffd84a;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.speaker{width:100%;aspect-ratio:3/4;border-radius:20px;background:#0b1220;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.speaker img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.speaker .label{position:absolute;bottom:12px;font-weight:900;text-shadow:0 2px 8px #000}
.repeat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.repeat button{font-size:1.15rem}
.carpetVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.letterOut{position:absolute;left:50%;top:34%;transform:translate(-50%,-20%) scale(.2);opacity:0;font-size:5.4rem;font-weight:900;color:#ffe27a;text-shadow:0 0 22px #ffd84a;pointer-events:none}
.letterOut.show{animation:stepout 2.2s ease forwards}
@keyframes stepout{to{transform:translate(-50%,80%) scale(1);opacity:1;top:52%}}
.say-controls{display:flex;gap:12px;justify-content:center;margin:14px 0 8px}
.say-controls button{width:72px;height:72px;border-radius:50%;font-size:2rem;padding:0}
.btn-rec{background:#c0392b}
.btn-stop{background:#4b5568}
.rec-bars{display:flex;gap:4px;justify-content:center;height:28px;align-items:flex-end;margin:8px 0}
.rec-bars i{width:8px;height:8px;background:#3ecf8e;border-radius:3px}
.spd button.active,.repeat button.active{background:linear-gradient(135deg,#4d7dff,#7a5cff)}
.tile.punct{min-width:36px;background:#5a3b1b}
.loadbar{padding:0 12px 10px}
.loadbar-track{height:10px;background:#1b2740;border-radius:8px;overflow:hidden}
#loadbarFill{height:100%;width:0;background:linear-gradient(90deg,#4d7dff,#3ecf8e);transition:width .18s ease;border-radius:8px}
#loadbarLbl{text-align:center;font-size:.72rem;color:var(--muted);margin-top:6px;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="bookTitle">MRJ Decodables</h1>
      <div id="modeBadge" style="font-size:.75rem;color:var(--muted)">Library</div>
    </div>
    <select id="langPick" style="max-width:42%;margin:0 6px"></select>
    <button id="btnLibrary">📚 Books</button>
  </header>
  <div id="libStage" class="stage panel">
    <div class="library" id="libList"></div>
  </div>
  <div id="introStage" class="stage panel hidden">
    <div id="introBody"></div>
    <button id="introGo" style="width:100%;margin-top:16px">Next</button>
  </div>
  <div id="bookStage" class="stage hidden">
    <div class="art" id="art"></div>
    <div class="sentence" id="sentence"></div>
    <div class="langline" id="langLine"></div>
    <div class="status" id="status"></div>
    <div class="nav">
      <button id="prev">◀</button>
      <button id="play">▶ Listen</button>
      <button id="next">▶</button>
    </div>
  </div>
  <div id="workStage" class="stage panel hidden">
    <div id="workBody"></div>
  </div>
</div>
<div class="bar">
  <div class="bar-row">
    <button id="mListen">Listen</button>
    <button id="mSong">Song</button>
    <button id="mRead">Read</button>
    <button id="mDict">Dictation</button>
    <button id="mSay">Say</button>
  </div>
</div>
<script src="pronounce/ort/ort.all.min.js"></script>
<script src="pronounce/engine.js"></script>
<script src="pronounce/audio.js"></script>
<script src="pronounce/grade-browser.js"></script>
<script>
const QS=new URLSearchParams(location.search);
const TEST=QS.get('test')==='1';
const ASSET_V='dec20260917v3';
const BASE=(function(){
  const p=location.pathname;
  if(/\.html?$/i.test(p)) return p.replace(/[^/]+$/,'');
  return p.endsWith('/')?p:p+'/';
})();
const LISTEN_RATE=0.8;
const LISTEN_LOOPS=3;
const GRADE_PATH='/api/grade';
(function bounceToMicHost(){
  const h=location.hostname;
  const loop=h==='127.0.0.1'||h==='localhost';
  if(location.protocol==='http:' && !loop && location.port==='8765'){
    location.replace('https://'+h+':8768'+location.pathname+location.search);
  }
})();
const $=id=>document.getElementById(id);
const asset=p=>BASE+'assets/'+String(p||'').replace(/^assets\//,'')+'?v='+ASSET_V;
const SAVE='mrj_dec_progress_v4';
const MAX_BOOKS=10;
const SPEAK_DEFAULT=50;
const DICT_N=5;
const DICT_PASS=80;
const COUSIN_META={no_latin_script:['ko','ja','zh-Hans','hi','ar'],latin_letters:{vi:'aăâbcdđeêghiklmnoôơpqrstuưvxy',es:'abcdefghijklmnñopqrstuvwxyz','pt-BR':'abcdefghijklmnopqrstuvwxyz',fr:'abcdefghijklmnopqrstuvwxyz',de:'abcdefghijklmnopqrstuvwxyzäöüß',id:'abcdefghijklmnopqrstuvwxyz',tr:'abcçdefgğhıijklmnoöprsştuüvyz',it:'abcdefghijklmnopqrstuvwxyz',pl:'aąbcćdeęfghijklłmnńoóprsśtuwyzźż'}};
const SOUND_HINT={a:'/æ/ · sat',m:'/m/ · mat',s:'/s/ · sat',t:'/t/ · sat',p:'/p/ · tap',i:'/ɪ/ · pit',n:'/n/ · ant',f:'/f/ · fan',o:'/ɑ/ · pot',d:'/d/ · dad',c:'/k/ · cat',u:'/ʌ/ · sun',g:'/g/ · dog',v:'/v/ · van'};
const NEW_LETTERS={mlr_dec_001:['a','m','s','t'],mlr_dec_002:['p'],mlr_dec_003:['i'],mlr_dec_004:['n'],mlr_dec_005:['f'],mlr_dec_006:['o'],mlr_dec_007:['d'],mlr_dec_008:['c'],mlr_dec_009:['u'],mlr_dec_010:['g']};
const TAUGHT={mlr_dec_001:['a','m','s','t'],mlr_dec_002:['a','m','s','t','p'],mlr_dec_003:['a','m','s','t','p','i'],mlr_dec_004:['a','m','s','t','p','i','n'],mlr_dec_005:['a','m','s','t','p','i','n','f'],mlr_dec_006:['a','m','s','t','p','i','n','f','o'],mlr_dec_007:['a','m','s','t','p','i','n','f','o','d'],mlr_dec_008:['a','m','s','t','p','i','n','f','o','d','c'],mlr_dec_009:['a','m','s','t','p','i','n','f','o','d','c','u'],mlr_dec_010:['a','m','s','t','p','i','n','f','o','d','c','u','g']};
let lib=null, i18n=null, pack=null, pageIndex=0, mode='library', audio=null, listenGen=0, hlRaf=0;
let introStep='mode', cousinIdx=0;
let tapped=new Set(), heardListen=new Set(), heardSong=new Set();
let clipDone=false, showLang=true, lang='ko';
let dictBuilt=[], dictQueue=[], dictIdx=0, dictRight=0, dictRate=0.8;
let speakRec=null, sayPage=0, micCtx=null, lastYouBlob=null;

function blankProg(){ return {passed:false,listen:false,song:false,read:false,dictation:false,speak:false,readPages:{},difficulty:null,dictScore:null,speakPages:{}}; }
function loadAll(){ try{return JSON.parse(localStorage.getItem(SAVE)||'{}');}catch(e){return{};} }
function saveAll(p){ localStorage.setItem(SAVE, JSON.stringify(p)); }
function bookProg(id){ return Object.assign(blankProg(), (loadAll()[id]||{})); }
function setBookProg(id, patch){ const all=loadAll(); all[id]=Object.assign(blankProg(), bookProg(id), patch); saveAll(all); }
function settings(){ return Object.assign({parentLock:false,showLang:true,lang:'ko'}, loadAll()._settings||{}); }
function setSettings(patch){ const all=loadAll(); all._settings=Object.assign(settings(), patch); saveAll(all); }
function bookOrder(){ return (lib.books||[]).slice(0, MAX_BOOKS).map(b=>b.id); }
function unlocked(id){ const o=bookOrder(); const i=o.indexOf(id); return i===0 || (i>0 && !!bookProg(o[i-1]).passed); }
function gloss(lem){ return ((pack&&pack.glossary&&pack.glossary.entries)||[]).find(x=>x.lemma===lem); }
function tokens(s){ return String(s||'').toLowerCase().replace(/[^a-z'\\s]/g,' ').split(/\s+/).filter(Boolean); }
function page(){ return pack.pages[pageIndex]; }
function pageTr(){ const b=i18n.books[pack.book_id]; return (b && b.l1[lang] && b.l1[lang][pageIndex]) || ''; }

function stopWordHighlight(){ if(hlRaf){ cancelAnimationFrame(hlRaf); hlRaf=0; } }
function syncWordHighlight(a, gen){
  stopWordHighlight();
  const apply=()=>{
    if(gen!==listenGen || audio!==a) return;
    const els=[...$('sentence').querySelectorAll('.w')];
    const n=els.length;
    if(!n) return;
    const d=a.duration;
    let idx=0;
    if(d && isFinite(d) && d>0){
      const frac=Math.max(0, Math.min(0.999999, (a.currentTime||0)/d));
      idx=Math.min(n-1, Math.floor(frac*n));
    }
    for(let i=0;i<n;i++) els[i].classList.toggle('on', i===idx);
  };
  const tick=()=>{
    if(gen!==listenGen || audio!==a) return;
    apply();
    if(!a.paused && !a.ended) hlRaf=requestAnimationFrame(tick);
  };
  a.ontimeupdate=apply;
  a.onloadedmetadata=apply;
  apply();
  hlRaf=requestAnimationFrame(tick);
}
function stopA(){
  stopWordHighlight();
  if(audio){ try{audio.pause();}catch(e){} audio.onended=null; audio.ontimeupdate=null; audio.onloadedmetadata=null; audio=null; }
}
function playPath(path, onend, rate){
  stopA(); if(!path){ if(onend) onend(); return; }
  const a=new Audio(asset(path)); audio=a;
  a.playbackRate = (rate==null?1:rate);
  a.onended=()=>{ if(audio===a && onend) onend(); };
  if(mode==='listen' || mode==='song') syncWordHighlight(a, listenGen);
  a.play().catch(()=>{});
}
function playTimes(path, n, rate){
  let left=Math.max(1, n|0);
  const once=()=>{ if(left<=0) return; left--; playPath(path, once, rate); };
  once();
}
function playWord(lem, onend){
  playPath('books/'+pack.book_id+'/audio/words/'+lem+'.mp3', onend, 1);
}

async function boot(){
  lib=await (await fetch(BASE+'assets/decodable_library.json?v='+ASSET_V)).json();
  i18n=await (await fetch(BASE+'assets/decodable_i18n.json?v='+ASSET_V)).json();
  lang=settings().lang||i18n.default||'ko';
  showLang=settings().showLang!==false;
  $('langPick').innerHTML=i18n.languages.map(l=>`<option value="${l.code}" ${l.code===lang?'selected':''}>${l.name}</option>`).join('');
  $('langPick').onchange=e=>{
    lang=e.target.value;
    setSettings({lang});
    if(mode==='library' || !pack) showLib();
    else if(mode==='intro') showIntro();
    else if(mode==='listen'||mode==='song'||mode==='read') renderPage();
    else if(mode==='dictation') startDictation();
    else if(mode==='speak') renderSay();
  };
  $('btnLibrary').onclick=()=>showLib();
  $('mListen').onclick=()=>setMode('listen');
  $('mSong').onclick=()=>setMode('song');
  $('mRead').onclick=()=>setMode('read');
  $('mDict').onclick=()=>setMode('dictation');
  $('mSay').onclick=()=>setMode('speak');
  try{
    if(window.MRJPronounce){
      MRJPronounce.setBase(BASE+'pronounce/');
      MRJPronounce.load().then(()=>{pronounceLoaded=true;}).catch(()=>{});
    }
  }catch(e){}
  $('prev').onclick=()=>go(-1);
  $('next').onclick=()=>go(1);
  $('play').onclick=()=>playPage(true);
  $('introGo').onclick=()=>introAdvance();
  const want=QS.get('book');
  if(want && bookOrder().includes(want) && (TEST || unlocked(want))) openBook(want);
  else showLib();
}
function hideAll(){ ['libStage','introStage','bookStage','workStage'].forEach(id=>$(id).classList.add('hidden')); }
function showLib(){
  mode='library'; pack=null; stopA(); hideAll();
  $('libStage').classList.remove('hidden');
  $('bookTitle').textContent='MRJ Decodables';
  $('modeBadge').textContent='Books 1–10';
  $('libList').innerHTML=bookOrder().map(id=>{
    const b=lib.books.find(x=>x.id===id);
    const open=TEST || unlocked(b.id), done=bookProg(b.id).passed;
    return `<button class="card${open?'':' lock'}" data-id="${b.id}" ${open?'':'disabled'}>
      <img src="${asset(b.cover)}" alt="">
      <div><b>${b.title}</b>
      <div style="color:#a9b7d6;font-size:.85rem">${b.level} · ${b.sound}</div>
      <div style="font-size:.8rem;margin-top:4px">${done?'✅ Passed':(open?'Ready':'🔒 Pass the book before this')}</div></div></button>`;
  }).join('')+(TEST?`<button id="tryDict" style="width:100%">Try dictation (skip to test)</button><button id="resetProg" style="width:100%">Reset progress</button>`:'');
  document.querySelectorAll('.card').forEach(el=>{ if(!el.disabled) el.onclick=()=>openBook(el.dataset.id); });
  const rst=$('resetProg'); if(rst) rst.onclick=()=>{ localStorage.removeItem(SAVE); showLib(); };
  const td=$('tryDict'); if(td) td.onclick=()=>{ location.search='?test=1&mode=dictation&book='+(bookOrder()[0]||'mlr_dec_001'); };
}
async function openBook(id){
  if(!TEST && !unlocked(id)) return;
  pack=await (await fetch(BASE+'assets/align_'+id+'.json?v='+ASSET_V)).json();
  pageIndex=0; tapped=new Set(); heardListen=new Set(); heardSong=new Set(); clipDone=false;
  const bp=bookProg(pack.book_id);
  if(bp.readPages){ Object.keys(bp.readPages).forEach(k=>{ if(bp.readPages[k]){ const n=tokens((pack.pages[+k]||{}).text).length; for(let i=0;i<n;i++) tapped.add((+k)+':'+i); } }); }
  $('bookTitle').textContent=pack.title;
  if(TEST && (QS.get('mode')==='dictation' || QS.get('mode')==='speak')){
    const diff=QS.get('diff')==='hard'?'hard':'easy';
    const patch={difficulty:diff,listen:true,song:true,read:true};
    if(QS.get('mode')==='speak') patch.dictation=true;
    setBookProg(pack.book_id,patch);
    setMode(QS.get('mode'));
    return;
  }
  introStep = 'cousin';
  cousinIdx=0;
  showIntro();
}

function cousinLetters(){ return NEW_LETTERS[pack.book_id]||[]; }
function cousinGlyph(letter){
  const L=String(letter||'').toLowerCase();
  if(!L) return '';
  if((COUSIN_META.no_latin_script||[]).includes(lang)) return '';
  const alpha=(COUSIN_META.latin_letters||{})[lang]||'';
  return alpha.includes(L)?L:'';
}

function showIntro(){
  mode='intro'; stopA(); hideAll();
  $('introStage').classList.remove('hidden');
  $('introGo').classList.remove('hidden');
  const famous=(pack.famous||[])[0]||'';
  if(introStep==='cousin'){
    const letters=cousinLetters();
    if(!letters.length){ introStep='famous-card'; showIntro(); return; }
    const L=letters[cousinIdx];
    const cu=cousinGlyph(L);
    $('modeBadge').textContent='Letter '+(cousinIdx+1)+' / '+letters.length;
    const cousinBlock=cu
      ? `<div class="g-lbl">Cousin in ${lang}</div><div class="cu">${cu}</div>`
      : `<div class="g-lbl">Cousin</div><div class="sadface">😢</div><div style="color:var(--muted);font-weight:800;margin-top:6px">Does not exist in this language.</div>`;
    $('introBody').innerHTML=`<div class="onelet">
      <div class="g-lbl">The letter</div>
      <div class="en">${L.toUpperCase()}</div>
      <img src="${asset('decodable/mouth/'+L+'.svg')}" alt="Mouth diagram for ${L.toUpperCase()}" style="max-height:160px;width:auto;object-fit:contain;margin:10px auto;display:block">
      <div style="font-size:.65rem;color:var(--muted);margin-bottom:6px">Mouth picture: Wikimedia / IPA (CC BY-SA)</div>
      ${cousinBlock}

function canEnter(m){

  if(TEST) return true;

  if(m==='song') return bp.listen || mode==='song' || mode==='listen-end';
  if(m==='read') return bp.song || mode==='read';

  if(m==='speak') return bp.dictation;

}
function setMode(m){

    if(want==='speak'){

    } else if(m==='read' && bp.listen && !bp.song) m='song';
    else if(!bp.listen) m='listen';
    else if(!bp.song) m='song';
    else if(!bp.read) m='read';

  $('mDict').classList.toggle('active', m==='dictation');
  $('mSay').classList.toggle('active', m==='speak');
  if(m==='listen-end'){ $('workStage').classList.remove('hidden'); renderListenEnd(); }
  else if(m==='dictation'){ $('workStage').classList.remove('hidden'); startDictation(); }

function allTapped(){

  for(let i=0;i<n;i++){ if(!tapped.has(pageIndex+':'+i)) return false; }

}
function nextLocked(){

function go(d){

    return;
  }
  const nxt=pageIndex+d;
  if(nxt<0) return;
  listenGen++;
  stopA();
  if(nxt>=pack.pages.length){
    if(mode==='listen'){ setBookProg(pack.book_id,{listen:true}); setMode('listen-end'); return; }
    if(mode==='song'){ setBookProg(pack.book_id,{song:true}); pageIndex=0; setMode('read'); return; }
    if(mode==='read'){ setBookProg(pack.book_id,{read:true}); setMode('dictation'); return; }

}

function playPage(manual){
  const p=page();

  clipDone=false; $('next').disabled=nextLocked();
  const rate = mode==='listen' ? LISTEN_RATE : 1;
  const gen=++listenGen;
  const startPage=pageIndex;
  const startMode=mode;
  if(mode==='listen'){
    let loop=0;
    const playOnce=()=>{
      if(gen!==listenGen || pageIndex!==startPage || mode!=='listen') return;
      loop++;
      $('status').textContent=`Listen ${loop} / ${LISTEN_LOOPS}`;
      playPath(path, ()=>{
        if(gen!==listenGen || pageIndex!==startPage || mode!=='listen') return;
        if(loop<LISTEN_LOOPS){ playOnce(); return; }
        clipDone=true;
        heardListen.add(pageIndex);
        document.querySelectorAll('.w').forEach(e=>e.classList.remove('on'));
        $('next').disabled=nextLocked();
        $('status').textContent=`${pageIndex+1} / ${pack.pages.length} · Page heard.`;
        if(manual) return;
        go(1);
      }, rate);
    };
    playOnce();

  }
  playPath(path, ()=>{
    if(gen!==listenGen || pageIndex!==startPage || mode!==startMode) return;
    clipDone=true;
    if(mode==='song') heardSong.add(pageIndex);
    document.querySelectorAll('.w').forEach(e=>e.classList.remove('on'));
    $('next').disabled=nextLocked();
    $('status').textContent=`${pageIndex+1} / ${pack.pages.length} · Page heard.`;

function onWordTap(el){
  const lem=el.dataset.lem, i=+el.dataset.i;
  document.querySelectorAll('.w').forEach(w=>w.classList.remove('on'));
  if(mode==='read'){
    const wasDone=!!(bookProg(pack.book_id).readPages||{})[pageIndex];

      playWord(lem, ()=>{ if(mode==='read' && !wasDone) go(1); });
      return;

function tileWord(el){ try{ return decodeURIComponent(el.dataset.word||''); }catch(e){ return el.dataset.word||''; } }
function unique(a){ return [...new Set(a)]; }
function dictLettersOf(s){ return String(s||'').replace(/[^A-Za-z]/g,'').split(''); }
function renderEasyTpl(text, filled){
  let i=0;
  return dictEasyTokens(text).map(tok=>{
    if(/[A-Za-z]/.test(tok)){
      const v=filled[i++]||'';
      const safe=String(v||'___').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return `<span class="blank${v?' on':''}">${safe}</span>`;
    }
    const safe=String(tok).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<span class="given">${safe}</span>`;
  }).join(' ');
}
function renderDictTpl(text, filled){
  let i=0;
  return [...String(text||'')].map(ch=>{
    if(/[A-Za-z]/.test(ch)){
      const v=filled[i++]||'';
      return `<span class="blank${v?' on':''}">${v||'_'}</span>`;
    }
    if(ch===' ') return `<span class="gap"></span>`;
    const safe=String(ch).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<span class="given">${safe}</span>`;
  }).join('');
}
function dictNorm(s){ return String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim(); }
function dictWordsOf(s){ return dictNorm(s).split(' ').filter(Boolean); }
function dictEasyTokens(s){
  const out=[];
  const re=/[A-Za-z']+|[,.!?;:]+|[“”"…]+/g;
  let m; const src=String(s||'');
  while((m=re.exec(src))) out.push(m[0]);
  return out;
}
function dictEasyJoin(arr){
  return (arr||[]).reduce((s,t)=> /[,.!?;:”"…]/.test(t) ? s+t : (s?s+' ':'')+t, '');
}
function dictDisplayWords(s){ return dictEasyTokens(s).filter(w=>/[A-Za-z]/.test(w)); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function dictItems(){
  const locked=(pack.dictation&&pack.dictation.items)||[];
  if(locked.length>=DICT_N) return locked.slice(0,DICT_N);
  const prefer=pack.pages.filter(p=>dictWordsOf(p.text).length>=2);
  const pool=prefer.length?prefer:pack.pages;
  return pool.slice(0,DICT_N).map(p=>({page_id:p.page_id,text:p.text,audio:p.audio}));
}
function fillerWords(targetTokens){
  const have=new Set(targetTokens.map(w=>w.toLowerCase()));
  const bank=unique(pack.pages.flatMap(p=>dictDisplayWords(p.text))).filter(w=>!have.has(w.toLowerCase()));
  return shuffle(bank).slice(0,3);
}
function startDictation(){

function paintBuiltEasy(){

function paintSpeedBtns(){

function nextDict(){
  if(dictIdx>=dictQueue.length){
    const pct=Math.round(100*dictRight/dictQueue.length);
    if(pct>=DICT_PASS){ setBookProg(pack.book_id,{dictation:true,dictScore:pct}); setMode('speak'); }
    else {
      $('workBody').innerHTML=`<div class="pass">${pct}%</div>
        <div style="text-align:center">Need 80% on 5 sentences. Try again.</div>

      $('retryD').onclick=()=>startDictation();
    }

  }
  const item=dictQueue[dictIdx];
  const targetTokens=dictEasyTokens(item.text);
  const wordTokens=targetTokens.filter(w=>/[A-Za-z]/.test(w));
  const hard=(bookProg(pack.book_id).difficulty||'easy')==='hard';
  dictBuilt=[];
  let tilesHtml='';
  if(hard){
    tilesHtml=`<div class="az">${'abcdefghijklmnopqrstuvwxyz'.split('').map(t=>`<button class="tile" data-ch="${t}">${t}</button>`).join('')}<button class="tile" data-ch="del">⌫</button></div>`;
  } else {
    const tiles=shuffle([
      ...wordTokens.map((w,i)=>({id:'t'+i,word:w})),

    tilesHtml=`<div class="tiles">${tiles.map(t=>`<button class="tile" data-id="${t.id}" data-word="${encodeURIComponent(t.word)}">${t.word.replace(/</g,'&lt;')}</button>`).join('')}</div>`;
  }

    <div class="speaker"><img src="${asset('decodable/harper.png')}" alt="Miss Harper"><div class="label">Miss Harper · says the sentence</div></div>
    <div class="g-lbl">Dictation ${dictIdx+1} / ${dictQueue.length} · ${hard?'Hard · letters only. Punctuation already there.':'Easy · words. Punctuation already there.'}</div>
    <div class="${hard?'tpl':'tpl'}" id="built">${hard?renderDictTpl(item.text,[]):renderEasyTpl(item.text,[])}</div>
    ${tilesHtml}
    <div class="g-lbl">Speed</div>
    <div class="repeat spd">
      <button id="spd100" type="button">100%</button>
      <button id="spd80" type="button">80%</button>
      <button id="spd50" type="button">50%</button>
    </div>
    <div class="repeat">
      <button id="hear1x" type="button">1x</button>
      <button id="hear3x" type="button">3x</button>
      <button id="hear5x" type="button">5x</button>
    </div>
    <button id="clearWord" style="width:100%">Clear</button>
    <div class="status" id="dictStatus">Need 4 of 5. Right so far: ${dictRight}</div>`;
  const hearN=n=>playTimes(item.audio, n, dictRate);
  paintSpeedBtns();
  const pe=$('pickEasy'), ph=$('pickHard');
  if(pe) pe.onclick=()=>chooseDiff('easy');
  if(ph) ph.onclick=()=>chooseDiff('hard');
  $('hear1x').onclick=()=>hearN(1);
  $('hear3x').onclick=()=>hearN(3);
  $('hear5x').onclick=()=>hearN(5);
  $('clearWord').onclick=()=>{
    dictBuilt=[];
    if(hard) $('built').innerHTML=renderDictTpl(item.text,[]);
    else { $('built').innerHTML=renderEasyTpl(item.text,[]); document.querySelectorAll('.tile').forEach(b=>b.classList.remove('used')); }
  };
  if(hard){
    const need=dictLettersOf(item.text);
    document.querySelectorAll('.az .tile, .tile').forEach(b=>b.onclick=()=>{
      const ch=b.dataset.ch;
      if(!ch) return;
      if(ch==='del') dictBuilt.pop();
      else if(dictBuilt.length<need.length) dictBuilt.push(ch);
      $('built').innerHTML=renderDictTpl(item.text, dictBuilt);
      if(dictBuilt.length>=need.length){
        const ok=dictBuilt.join('').toLowerCase()===need.join('').toLowerCase();
        markDict(ok);
      }
    });
  } else {
    document.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('used')) return;
      b.classList.add('used');
      dictBuilt.push(tileWord(b));
      $('built').innerHTML=renderEasyTpl(item.text, dictBuilt);
      if(dictBuilt.length>=wordTokens.length){
        const ok=dictBuilt.map(w=>w.toLowerCase()).join(' ')===wordTokens.map(w=>w.toLowerCase()).join(' ');
        markDict(ok);
      }
    });

}

  const scored=(words||[]).filter(w=>w && w.word);
  $('sayLineText').innerHTML=parts.map(tok=>{
    if(!tok.trim()) return tok;
    const lemma=tok.replace(/[^A-Za-z']/g,'').toLowerCase();
    if(!lemma) return tok.replace(/</g,'&lt;');
    const w=scored[wi];
    wi++;
    if(!w){
      return `<span class="word-chip pending">${tok.replace(/</g,'&lt;')}<span class="wsub">·</span></span>`;
    }
    const ws=Math.round(100*(w.score||0));
    const b=ws>=80?'good':(ws>=65?'ok':'needs_work');
    return `<span class="word-chip ${b}">${tok.replace(/</g,'&lt;')}<span class="wsub">${ws}%</span></span>`;
  }).join('');
}
function startSpeak(){
  sayPage = Object.keys(bookProg(pack.book_id).speakPages||{}).length;
  if(sayPage>=pack.pages.length){ setBookProg(pack.book_id,{speak:true}); setMode('pass'); return; }
  renderSay();
}
function renderSay(){
  const p=pack.pages[sayPage];
  $('workBody').innerHTML=`
    <div class="g-lbl">Say the page · ${sayPage+1} / ${pack.pages.length}</div>
    <div class="g-en" id="sayLineText"></div>
    <div class="langline">${showLang? (i18n.books[pack.book_id].l1[lang][sayPage]||'') : ''}</div>
    <div class="loadbar hidden" id="loadbar"><div class="loadbar-track"><div id="loadbarFill"></div></div><div id="loadbarLbl"></div></div>
    <div class="status" id="speakStatus">Listen, then tap the mic and say it. Pass is ${SPEAK_DEFAULT}%.</div>
    <div class="say-controls">
      <button id="hearLine" type="button" title="Listen" aria-label="Listen">🔊</button>
      <button id="sayLine" class="btn-rec" type="button" title="Speak" aria-label="Speak">🎙️</button>
      <button id="sayStop" class="btn-stop hidden" type="button" title="Stop" aria-label="Stop">⏹️</button>
    </div>
    <div class="rec-bars hidden" id="recBars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="wordScores"></div>
    <div class="status" id="speakHeard"></div>
    <button id="sayNext" class="hidden" type="button" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#4d7dff,#7a5cff)">Next</button>`;
  paintSayChips(p.text, null);
  $('hearLine').onclick=()=>playPath(p.audio, null, LISTEN_RATE);
  wireRecorder(p.text);
  kickPronouncePreload();
}
function wireRecorder(line){
  const btn=$('sayLine');
  const stopBtn=$('sayStop');
  const bars=$('recBars');
  let rec=null, chunks=[], stream=null, watch=null, analyser=null;
  const hideLive=()=>{
    stopBtn.classList.add('hidden');
    bars.classList.add('hidden');
    if(watch){ clearInterval(watch); watch=null; }
  };
  const stop=()=>{
    if(rec && rec.state!=='inactive') rec.stop();
  };
  const start=async ()=>{
    unlockMic();
    const nx=$('sayNext'); if(nx) nx.classList.add('hidden');
    $('speakStatus').textContent='Listening… speak now';
    $('speakHeard').textContent='';
    $('wordScores').innerHTML='';
    chunks=[];
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop=async ()=>{
      hideLive();
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks, {type: rec.mimeType||'audio/webm'});
      lastYouBlob=blob;
      await gradeBlob(line, blob);
    };
    rec.start();
    stopBtn.classList.remove('hidden');
    bars.classList.remove('hidden');
    const ctx=unlockMic();
    if(ctx){
      const src=ctx.createMediaStreamSource(stream);
      analyser=ctx.createAnalyser();
      analyser.fftSize=512;
      const silent=ctx.createGain(); silent.gain.value=0;
      src.connect(analyser); analyser.connect(silent); silent.connect(ctx.destination);
      const data=new Uint8Array(analyser.fftSize);
      let quiet=0, heard=false;
      watch=setInterval(()=>{
        analyser.getByteTimeDomainData(data);
        let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
        const rms=Math.sqrt(sum/data.length);
        const kids=[...bars.querySelectorAll('i')];
        kids.forEach((el,i)=>{ el.style.height=Math.max(6, Math.min(28, rms*140 + (i%3)*3))+'px'; });
        if(rms>0.04){ heard=true; quiet=0; $('speakStatus').textContent='Hearing you…'; }
        else if(heard){ quiet++; if(quiet>10) stop(); }
      }, 120);
    }
  };
  btn.onclick=async ev=>{
    ev.preventDefault();
    if(rec && rec.state==='recording') return;
    try{ await start(); }
    catch(e){ $('speakStatus').textContent='Mic blocked. Allow the microphone, then tap 🎙️ again.'; }
  };
  stopBtn.onclick=ev=>{ ev.preventDefault(); stop(); };
}
async function gradeBlob(line, blob){
  const nx=$('sayNext'); if(nx) nx.classList.add('hidden');
  $('speakStatus').textContent='Checking your speaking…';
  if(!window.MRJPronounce){
    hideLoadbar();
    $('speakStatus').textContent='Scoring engine missing. Reload the page.';
    return;
  }
  let j;
  try{
    if(!pronounceLoaded) setLoadbar({stage:'download',pct:5});
    await MRJPronounce.load(onPronounceProgress);
    $('speakStatus').textContent='Checking your speaking…';
    startGradeBarAnim(pronounceLoaded?55:30);
    j=await MRJPronounce.grade(blob, line);
  }catch(e){
    hideLoadbar();
    $('speakStatus').textContent='Scoring failed. Tap 🎙️ again. '+(e && e.message ? e.message : '');
    return;
  }
  hideLoadbar();
  if(j.meta && String(j.meta.scoring_mode||'').startsWith('stub')){
    $('speakStatus').textContent='Grader came back stub. Real model did not load.';
    return;
  }
  const sc=Math.round(100*(j.overall&&j.overall.score||0));
  const band=(j.overall&&j.overall.band)||'';
  $('speakHeard').textContent=sc+'% · '+band+' · '+(j.model_id||'');
  paintSayChips(line, j.words||[]);
  $('wordScores').innerHTML='';
  if(sc>=SPEAK_DEFAULT){
    $('speakStatus').textContent=sc+'% — you passed! Tap Next.';
    const nextBtn=$('sayNext');
    if(nextBtn){
      nextBtn.classList.remove('hidden');
      nextBtn.onclick=()=>finishSayPage(sc);
    }
  }else $('speakStatus').textContent=sc+'% — need '+SPEAK_DEFAULT+'%. Listen, then tap 🎙️ and say it again.';
}
function finishSayPage(score){
  const sp=Object.assign({}, bookProg(pack.book_id).speakPages||{});
  sp[sayPage]=score; setBookProg(pack.book_id,{speakPages:sp});
  sayPage++;
  if(sayPage>=pack.pages.length){ setBookProg(pack.book_id,{speak:true}); setMode('pass'); }
  else renderSay();
}
function renderPass(){
  const bp=bookProg(pack.book_id);
  setBookProg(pack.book_id,{passed:true,listen:true,song:true,read:true,dictation:true,speak:true});
  const order=bookOrder(); const i=order.indexOf(pack.book_id); const nxt=order[i+1];
  $('workBody').innerHTML=`<div class="pass">✅ ${pack.title} passed</div>
    <div style="text-align:center;color:var(--muted)">Listen → button → Song → tap every word → 5 sentences (80%) → say every page.</div>
    <div style="text-align:center;margin-top:8px">Dictation ${bp.dictScore||''}%</div>
    <button id="backLib" style="width:100%;margin-top:16px">📚 Books</button>
    ${nxt?`<button id="nextBook" style="width:100%;margin-top:8px;background:linear-gradient(135deg,#4d7dff,#7a5cff)">Next book</button>`:''}`;
  $('backLib').onclick=()=>showLib();
  if(nxt) $('nextBook').onclick=()=>openBook(nxt);
}
boot();
</script>
